<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <style>
      .box { fill: white; stroke: #2E7D32; stroke-width: 2; rx: 8; }
      .box-aws { fill: #E8F5E9; stroke: #1B5E20; stroke-width: 2; rx: 8; }
      .box-app { fill: #E3F2FD; stroke: #1565C0; stroke-width: 2; rx: 8; }
      .box-dash { fill: #F3E5F5; stroke: #6A1B9A; stroke-width: 2; rx: 8; }
      .arrow { fill: none; stroke: #4A4A4A; stroke-width: 2; marker-end: url(#arrowhead); }
      .label { font: 12px 'Inter', 'Arial', sans-serif; fill: #374151; text-anchor: middle; }
      .title { font: bold 14px 'Inter', 'Arial', sans-serif; fill: #1F2937; text-anchor: middle; }
      .section-title { font: bold 16px 'Inter', 'Arial', sans-serif; fill: #1F2937; text-anchor: middle; }
      .small { font: 10px 'Inter', 'Arial', sans-serif; fill: #6B7280; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A4A4A"/>
    </marker>
  </defs>

  <!-- Background sections -->
  <rect x="20" y="20" width="960" height="160" fill="#FFF8E1" rx="8" stroke="#F59E0B" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="500" y="45" class="section-title">CONTENT CREATION (Online, Once)</text>

  <rect x="20" y="200" width="460" height="360" fill="#E8F5E9" rx="8" stroke="#1B5E20" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="250" y="225" class="section-title">STUDENT SIDE (Offline-First)</text>

  <rect x="520" y="200" width="460" height="360" fill="#F3E5F5" rx="8" stroke="#6A1B9A" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="750" y="225" class="section-title">BACKEND & DASHBOARD</text>

  <!-- Content Creation Flow -->
  <!-- Teacher Dashboard -->
  <rect x="60" y="70" width="180" height="70" class="box-dash"/>
  <text x="150" y="100" class="title">Teacher Dashboard</text>
  <text x="150" y="118" class="small">(React + Cognito)</text>

  <!-- Lambda Assemble -->
  <rect x="280" y="70" width="180" height="70" class="box-aws"/>
  <text x="370" y="100" class="title">Lambda: Assemble Pack</text>
  <text x="370" y="118" class="small">Lesson + Quiz + Assets</text>

  <!-- ElevenLabs -->
  <rect x="500" y="70" width="160" height="70" class="box-aws"/>
  <text x="580" y="100" class="title">ElevenLabs TTS</text>
  <text x="580" y="118" class="small">Kannada/Hindi/Tamil MP3</text>

  <!-- S3 + CloudFront -->
  <rect x="700" y="70" width="200" height="70" class="box-aws"/>
  <text x="800" y="100" class="title">S3 + CloudFront</text>
  <text x="800" y="118" class="small">Lesson Packs (JSON+SVG+MP3)</text>

  <!-- Arrows: Content Creation -->
  <path d="M240 105 L280 105" class="arrow"/>
  <path d="M460 105 L500 105" class="arrow"/>
  <path d="M660 105 L700 105" class="arrow"/>

  <!-- Download Arrow -->
  <path d="M800 150 L800 190" class="arrow"/>
  <text x="800" y="185" class="label" style="font-size:11px;">Download Pack (Brief Online)</text>

  <!-- STUDENT SIDE -->
  <!-- Flutter App Box -->
  <rect x="60" y="250" width="400" height="290" class="box-app"/>
  <text x="260" y="275" class="title" style="fill:#1565C0;">Flutter Android App</text>

  <!-- SQLite -->
  <rect x="80" y="295" width="160" height="55" class="box" style="stroke:#1565C0; fill:#E3F2FD;"/>
  <text x="160" y="318" class="label">SQLite Database</text>
  <text x="160" y="333" class="small">Students, Mastery, Sync Queue</text>

  <!-- Adaptive Engine -->
  <rect x="260" y="295" width="160" height="55" class="box" style="stroke:#1565C0; fill:#E3F2FD;"/>
  <text x="340" y="318" class="label">Adaptive Engine</text>
  <text x="340" y="333" class="small">Rule-based Mastery (Dart)</text>

  <!-- Audio Service -->
  <rect x="80" y="365" width="160" height="55" class="box" style="stroke:#1565C0; fill:#E3F2FD;"/>
  <text x="160" y="388" class="label">Audio Service</text>
  <text x="160" y="403" class="small">Cached MP3 Playback</text>

  <!-- Sync Service -->
  <rect x="260" y="365" width="160" height="55" class="box" style="stroke:#1565C0; fill:#E3F2FD;"/>
  <text x="340" y="388" class="label">Sync Service</text>
  <text x="340" y="403" class="small">Delta Queue + Retry</text>

  <!-- Lesson Assets -->
  <rect x="80" y="435" width="340" height="55" class="box" style="stroke:#1565C0; fill:#E3F2FD;"/>
  <text x="250" y="458" class="label">Lesson Assets (Offline)</text>
  <text x="250" y="473" class="small">JSON + SVG + MP3 (Cached Locally)</text>

  <!-- Offline Badge -->
  <rect x="60" y="510" width="400" height="35" fill="#FFF3E0" stroke="#F59E0B" stroke-width="2" rx="6"/>
  <text x="260" y="532" class="label" style="fill:#F59E0B; font-weight:600;">✈ Airplane Mode → "Offline Mode Active" Badge → Full Learning Works</text>

  <!-- Arrows: Student Side Internal -->
  <path d="M160 350 L160 365" class="arrow" style="stroke:#1565C0;"/>
  <path d="M340 350 L340 365" class="arrow" style="stroke:#1565C0;"/>
  <path d="M160 420 L160 435" class="arrow" style="stroke:#1565C0;"/>
  <path d="M340 420 L250 435" class="arrow" style="stroke:#1565C0;"/>

  <!-- Sync Arrow (Student → Backend) -->
  <path d="M460 400 L520 400" class="arrow"/>
  <text x="490" y="395" class="label" style="font-size:10px;">KB-sized Delta Sync</text>
  <text x="490" y="410" class="small" style="fill:#6A1B9A;">(eventId, mastery, timestamp)</text>

  <!-- BACKEND & DASHBOARD -->
  <!-- API Gateway + Lambda -->
  <rect x="560" y="250" width="200" height="70" class="box-aws"/>
  <text x="660" y="280" class="title">API Gateway + Lambda</text>
  <text x="660" y="298" class="small">POST /sync  •  GET /manifest</text>

  <!-- DynamoDB -->
  <rect x="780" y="250" width="160" height="70" class="box-aws"/>
  <text x="860" y="280" class="title">DynamoDB</text>
  <text x="860" y="298" class="small">Events, Students, Lessons</text>

  <!-- React Dashboard -->
  <rect x="560" y="350" width="380" height="180" class="box-dash"/>
  <text x="750" y="375" class="title" style="fill:#6A1B9A;">React Teacher Dashboard</text>
  <text x="750" y="395" class="small">(Hosted on S3 + CloudFront)</text>

  <!-- Dashboard Features -->
  <rect x="580" y="410" width="160" height="50" class="box" style="stroke:#6A1B9A; fill:#F3E5F5;"/>
  <text x="660" y="430" class="label">Skill-Gap Groups</text>
  <text x="660" y="445" class="small">"4 students need revision"</text>

  <rect x="760" y="410" width="160" height="50" class="box" style="stroke:#6A1B9A; fill:#F3E5F5;"/>
  <text x="840" y="430" class="label">Multi-Grade View</text>
  <text x="840" y="445" class="small">Grade 5 + 6 together</text>

  <rect x="580" y="470" width="160" height="50" class="box" style="stroke:#6A1B9A; fill:#F3E5F5;"/>
  <text x="660" y="490" class="label">Sync Health</text>
  <text x="660" y="505" class="small">Synced / Pending / Offline</text>

  <rect x="760" y="470" width="160" height="50" class="box" style="stroke:#6A1B9A; fill:#F3E5F5;"/>
  <text x="840" y="490" class="label">Activity Suggestions</text>
  <text x="840" y="505" class="small">10-min group exercises</text>

  <!-- Arrows: Backend -->
  <path d="M660 320 L660 350" class="arrow" style="stroke:#6A1B9A;"/>
  <path d="M760 285 L780 285" class="arrow" style="stroke:#1B5E20;"/>

  <!-- Bottom Summary -->
  <rect x="20" y="535" width="960" height="55" fill="#F0FDF4" stroke="#22C55E" stroke-width="2" rx="8"/>
  <text x="500" y="555" class="title" style="fill:#166534;">FLOW: Download Online → Learn Offline (Adaptive + Voice) → Store Locally → Auto-Sync Deltas → Teacher Insight by Skill Gap</text>
</svg>